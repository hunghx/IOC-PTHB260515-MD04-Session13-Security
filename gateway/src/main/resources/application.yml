spring:
  application:
        name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**,/api/test/**

server:
  port: 8080
jwt:
  secret-key: microservice-secret-key-springboot-2026-demo-security-configuration
