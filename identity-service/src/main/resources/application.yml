spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5432/microservice_db
    username: postgres
    password: 123456$
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret-key: microservice-secret-key-springboot-2026-demo-security-configuration
  expiration: 86400000